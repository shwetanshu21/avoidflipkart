<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Core site layout preview</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#d6dfe6;color:#082442;font:14px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 22px;background:white;border-bottom:1px solid #9fb3c4}h1{font-size:17px;margin:0}label{display:flex;align-items:center;gap:10px}select,a{font:inherit;padding:6px}main{padding:24px;width:max-content;min-width:100%;display:flex;justify-content:center}iframe{display:block;width:390px;height:844px;border:1px solid #7a94aa;background:white;box-shadow:0 6px 30px #08244220}
  </style>
</head>
<body>
  <header><h1>Core site layout preview</h1><label>Viewport <select id="viewport"><option value="360">360 × 800</option><option value="390" selected>390 × 844</option><option value="768">768 × 1024</option><option value="1280">1280 × 900</option></select></label><a href="/">Open the homepage</a></header>
  <main><iframe id="preview" src="/" title="Responsive homepage preview" width="390" height="844"></iframe></main>
  <script>
    const viewport = document.getElementById('viewport');
    const preview = document.getElementById('preview');
    viewport.addEventListener('change', () => {
      const heights = { 360: 800, 390: 844, 768: 1024, 1280: 900 };
      preview.style.width = viewport.value + 'px';
      preview.style.height = heights[viewport.value] + 'px';
    });
  </script>
</body>
</html>
