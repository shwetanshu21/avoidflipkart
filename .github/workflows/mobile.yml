name: Mobile and browser checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify game mechanics and content
        run: npm test
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test phone, tablet, landscape and desktop layouts
        run: npm run test:mobile
      - name: Save browser report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
